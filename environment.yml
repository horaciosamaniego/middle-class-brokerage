# Portable environment for both tiers. Tier 1 needs only python, numpy, pandas, scipy
# and matplotlib; graph-tool is needed for tier 2. Versions are left to the solver so
# that conda picks builds that run on the local system (a fully pinned export from one
# machine can require a newer C library than another machine has).
name: brokerage
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scipy
  - matplotlib-base
  - graph-tool-base
